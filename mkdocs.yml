site_name: Higher Computer Science

nav:
    - Home: 'index.md'
    - Software Design and Development: 
        - Development Methodologies:
          - Explanation: '01-software-development/1.1-development-methodologies.md'
          - Agile Methodologies: '01-software-development/1.2-agile-methodologies.md'
          - Iterative Methodologies: '01-software-development/1.3-the-iterative-development-Process.md'
        - Analysis:
          - Explanation: '01-software-development/2.1-analysis.md'
          - Analysis Tasks: '01-software-development/2.1.1-analysis-tasks.md'
        - Design:
          - Explanation: '01-software-development/3.1-design.md'
          - Data Flow In and Out: '01-software-development/3.1.3-data-flow-in-out.md'
          - Structure Diagrams: '01-software-development/3.1.1-structure-diagrams.md'
          - Pseudocode: '01-software-development/3.1.2-pseudocodeV1.md'
          - Wireframes: '01-software-development/3.1.4-wireframes.md'
          - Design Tasks: '01-software-development/3.1.5-design-modules-data-flow-tasks.md'
    - Computer Systems:
        - Data Representation:
          - Storing Negative Numbers: 
            - Two's Compliment: '02-computer-systems/2.1-twos-compliment.md'
            - Tasks: '02-computer-systems/2.1.1-twos-compliment-tasks.md'

      
markdown_extensions:
      - admonition
      - pymdownx.details
      - def_list
      - pymdownx.critic
      - pymdownx.caret
      - pymdownx.keys
      - pymdownx.mark
      - pymdownx.tilde
      - attr_list
      - md_in_html    
      - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
      - pymdownx.superfences
      - pymdownx.tabbed:
          alternate_style: true
      - pymdownx.highlight:
          use_pygments: true
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
      - pymdownx.inlinehilite
      - pymdownx.snippets
      
theme:
  name: material
  font:
    text: Quicksand
  palette:
    scheme: default
    primary: blue
    accent: deep orange
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes 
    - navigation.path
    #- navigation.footer
    - navigation.tabs
plugins:
  - glightbox

copyright: Copyright &copy; 2025 Pixel&Wood Computer Science Tuition

extra_css:
  - Styles/extra.css

    
